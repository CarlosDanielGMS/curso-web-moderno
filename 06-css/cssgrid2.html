<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>CSS Grid #02</title>
    <style>
        html,
        body {
            margin: 20px;
            height: calc(100% - 40px);
            background-color: lightgray;

            /* Habilita o CSS Grid */
            display: grid;

            /* Exibe três colunas de mesmo tamanho e nomeadas */
            grid-template-columns:
                [inicio] 1fr
                [metade-1 meio-1 primeira-metade] 1fr
                [metade-2 meio-2 segunda-metade] 1fr
                [fim];
            
            /* Exibe três linhas de mesmo tamanho */
            grid-template-rows: repeat(3, 1fr);

            /* Dá um espaçamento entre as colunas */
            column-gap: 20px;

            /* Dá um espaçamento entre as linhas */
            row-gap: 20px;

            /* Dá um espaçamento entre as colunas e as linhas */
            gap: 50px 10px;

            /* Dá um espaçamento entre os elementos */
            gap: 10px;
        }
        
        div {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            border: solid 5px dodgerblue;
            background: #fff;
        }

        .d1
        {
            /* Inicia a exibição do elemento na metade 2 */
            grid-column-start: metade-2;

            /* Finaliza a exibição do elemento no fim */
            grid-column-end: fim;

            /* Exibe o elemento entre o meio-1 e o fim */
            grid-column: meio-1 / fim;

            /* Exibe o elemento entre as linhas 1 e 1+2 */
            grid-row: 1 / span 2;

            /* Exibe o elemento entre as colunas meio-1 e fim e entre as linhas 1 e 1+3 */
            grid-area: 1 / meio-1 / span 3 / fim;
        }
    </style>
</head>

<body>
    <div class="d1">1</div>
    <div class="d2">2</div>
    <div class="d3">3</div>
</body>

</html>
