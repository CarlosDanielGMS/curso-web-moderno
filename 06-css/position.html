<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Position</title>
    <style>
        div
        {
            font-size: 30px;
            padding: 10px;
            border: solid 5px #222;
            color: white;
        }

        /* Padrão, desconsidera espaçamentos personalizados */
        .static
        {
            position: static;
            top: 100px;
            left: 100px;
            background-color: steelblue;
        }

        /* Fixo, mantém a posição onde for definida */
        .fixed
        {
            position: fixed;
            bottom: 30px;
            right: 0px;
            background-color: tomato;
        }

        /* Relativo, considera a posição do elemento anterior */
        .relative1
        {
            position: relative;
            top: 5px;
            left: 25px;
            background-color: seagreen;
        }

        /* Absoluto, desconsidera a posição do elemento anterior */
        .absolute1
        {
            position: absolute;
            top: 50px;
            left: 160px;
            background-color: violet;
        }

        /* Relativo, considera a posição do elemento anterior */
        .relative2
        {
            position: relative;
            top: 2000px;
            left: 200px;
            width: 200px;
            height: 200px;
            background-color: slategrey;
        }

        /* Absoluto, desconsidera a posição do elemento anterior (a menos que seja relativo) */
        .absolute2
        {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 20px;
            height: 20px;
            background-color: orange;
        }

        /* Sticky, limita a posição */
        .sticky
        {
            position: sticky;
            top: 10px;
            background-color: #777;
        }
    </style>
</head>

<body>
    <div class="static">Static (Padrão)</div>
    <div class="fixed">Fixed</div>
    <div class="relative1">Relative</div>
    <div class="absolute1">Absolute</div>

    <div class="relative2">
        <div class="absolute2"></div>
    </div>

    <div class="sticky">Sticky</div>
    <p style="padding-bottom: 2000px;">Opa</p>
</body>

</html>
