<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Flexbox #01</title>
    <link rel="stylesheet" href="css/tag.css">
    <style>
        .big
        {
            font-size: 1.5em;
        }

        .flex-container
        {
            /* Define o uso do Flex Box */
            display: flex;

            /* Define a direção padrão do Flex Box como sendo a coluna */
            flex-direction: column;

            /* Inverte a ordem vertical padrão dos elementos */
            flex-direction: column-reverse;

            /* Inverte a ordem horizontal padrão dos elementos */
            flex-direction: row-reverse;

            /* Define a direção padrão do Flex Box como sendo a linha */
            flex-direction: row;

            /* Define a largura do contêiner */
            width: 50%;

            /* Permite a quebra de linha do Flex Box */
            flex-wrap: wrap;

            /* Inverte a ordem horizontal padrão dos elementos */
            flex-wrap: wrap-reverse;
            
            /* Define a direção padrão do Flex Box como sendo a linha e permite a quebra de linha do Flex Box */
            flex-flow: row wrap;

            /* Define a altura do contêiner */
            height: 200px;
            
            /* Inverte a ordem vertical padrão dos elementos e permite a quebra de coluna do Flex Box */
            flex-flow: column-reverse wrap;
            
            /* Define a direção padrão do Flex Box como sendo a linha e permite a quebra de linha do Flex Box */
            flex-flow: row wrap;

            /* Alinha os elementos do Flex Box a partir do início */
            justify-content: flex-start;

            /* Alinha os elementos do Flex Box a partir do final */
            justify-content: flex-end;

            /* Alinha os elementos do Flex Box a partir do centro */
            justify-content: center;

            /* Distribui os elementos do Flex Box uniformemente */
            justify-content: space-around;

            /* Distribui os elementos do Flex Box apenas entre os próprios elementos */
            justify-content: space-between;

            /* Alinha os elementos do Flex Box de modo padrão */
            align-items: stretch;

            /* Alinha os elementos do Flex Box com base na linha */
            align-items: baseline;

            /* Alinha os elementos do Flex Box com base no início do Flex Item */
            align-items: flex-start;

            /* Alinha os elementos do Flex Box com base no final do Flex Item */
            align-items: flex-end;

            /* Alinha os elementos do Flex Box com base no centro do Flex Item */
            align-items: center;

            /* Alinha as linhas do Flex Box com base no início do Flex Item */
            align-content: flex-start;

            /* Alinha as linhas do Flex Box com base no final do Flex Item */
            align-content: flex-end;

            /* Alinha as linhas do Flex Box com base no centro do Flex Item */
            align-content: center;

            /* Alinha as linhas do Flex Box uniformemente */
            align-content: space-around;

            /* Alinha as linhas do Flex Box apenas entre os próprios elementos */
            align-content: space-between;
        }
    </style>
</head>

<body>
    <div class="flex-container tag nolabel">
        <div class="tag nolabel">1</div>
        <div class="tag nolabel">2</div>
        <div class="tag nolabel big">3</div>
        <div class="tag nolabel">4</div>
        <div class="tag nolabel">5</div>
        <div class="tag nolabel">6</div>
        <div class="tag nolabel">7</div>
        <div class="tag nolabel">8</div>
        <div class="tag nolabel">9</div>
        <div class="tag nolabel">10</div>
    </div>
    <script src="js/tag.js"></script>
</body>

</html>
