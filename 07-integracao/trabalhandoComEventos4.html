        // Seleciona o primeiro formulário presente na página
        const formulario = document.forms[0];
        // Declara a função a ser executada ao enviar o formulário
        formulario.onsubmit = evento =>
        {
            // Previne a execução padrão do evento (submeter)
            evento.preventDefault();
            // Captura o formulário, que é o "destino" do evento ao submeter
            const formulario = evento.target;
            // Captura os dados do formulário
            const dadosFormulario = new FormData(formulario);
            // Acrescenta o metadado 'Ajax' aos dados do formulário com o valor 'true'
            dadosFormulario.append('Ajax', true);
            // Exibe o valor da chave 'q' no console
            console.log(dadosFormulario.get('q'));
            // Exibe no terminal o resultado da verificação se o formulário possui a chave 'hl'
            console.log(dadosFormulario.has('hl'));
            // Percorre cada dado presente no formulário
            for (let dado of dadosFormulario)
            {
                // Exibe o par chave-valor do dado
                console.log(dado);
            }
        };
    </script>
