<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Selecionar Elementos #03</title>
    <link rel="stylesheet" href="css/estilo.css">
    <style>
        form {
            display: flex;
            flex-direction: column;
        }
        
        form input,
        form select,
        form button {
            margin: 10px;
            font-size: 1.6em;
        }
    </style>
</head>

<body class="conteudo exercicio">
    <h1>Formulário</h1>
    <form name="pesquisa" action="http://www.google.com.br/search">
        <input type="text" name="q" placeholder="Digite o termo...">
        <select name="hl">
            <option value="pt-br">Português (Brasil)</option>
            <option value="en-us">Inglês (Americano)</option>
        </select>
        <button>Pesquisar</button>
    </form>
    <script>
        // Seleciona uma coleção HTML com todos os formulários da página
        console.log(document.forms);
        
        // Seleciona todos os elementos do primeiro formulário da página
        console.log(document.forms[0]);
        
        // Seleciona uma lista do Node com todos os elementos da página com o nome 'pesquisa'
        console.log(document.getElementsByName('pesquisa'));
        
        // Seleciona todos os elementos dos formulários da página com o nome 'pesquisa'
        console.log(document.pesquisa);
        
        // Seleciona todos os elementos de nome 'q' dos formulários da página com o nome 'pesquisa'
        console.log(document.pesquisa.q);
        
        // Altera o valor padrão escrito no elemento de nome 'q' presente no elemento de nome 'pesquisa' da página
        document.pesquisa.q.value = 'Daniel é um gato!';
        
        // Altera o valor padrão selecionado no elemento de nome 'hl' presente no elemento de nome 'pesquisa' da página
        document.pesquisa.hl.value = 'en-us';

        // Exibe o índice do item selecionado no elemento de nome 'hl' presente no elemento de nome 'pesquisa' da página
        console.log(document.pesquisa.hl.selectedIndex);
    </script>
</body>

</html>
