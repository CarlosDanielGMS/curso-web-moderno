<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <title>Manipulando CSS</title>
    <link rel='stylesheet' href='css/estilo.css'>
    <script src='js/jquery.js'></script>
</head>

<body class='conteudo exercicio'>
    <h1>Manipulando CSS</h1>
    <div id='div1'>1</div>
    <div id='div2'>2</div>
    <div id='resultado'></div>
    <script>
        const $div1 = $('#div1');
        const $div2 = $('#div2');
        const $resultado = $('#resultado');
        
        // Captura o valor da propriedade CSS do elemento
        const fonteDiv1 = $div1.css('font-family');

        $resultado.append(`Fonte: ${fonteDiv1}`);
        
        // Altera o(s) valor(es) da(s) propriedade(s) CSS do elemento
        $div1.css('font-size', '3em');
        $div1.css
        (
            {
                'font-size': '3.5em',
                'color': 'yellow'
            }
        );
        $div1.css
        (
            'font-size',
            () => `${2 * 2}em`
        );
        
        // Adiciona a classe CSS ao elemento
        $div2.addClass('destaque');

        // Verifica se o elemento possui a classe CSS
        const temClasse = $div2.hasClass('destaque');

        $resultado.append(`<br>Classe: ${temClasse}`);

        // Remove a classe CSS do elemento
        $div2.removeClass('destaque');

        // Alterna a classe CSS do elemento
        $div2.toggleClass('destaque');
    </script>
</body>
