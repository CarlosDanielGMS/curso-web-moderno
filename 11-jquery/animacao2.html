<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <title>Animação #02</title>
    <link rel='stylesheet' href='css/estilo.css'>
    <script src='js/jquery.js'></script>
    <style>
        body {
            position: relative;
            background-color: #999;
            color: #000;
        }

        div {
            position: absolute;
            display: inline;
            border: solid 10px #000;
            padding: 50px;
            font-size: 3em;
            background-color: crimson;
        }
    </style>
</head>

<body>
    <div>Animar!</div>

    <script>
        function animarElemento (seletor, propriedades, opcoes)
        {
            return new Promise
            (
                (resolver, rejeitar) =>
                {
                    // Anima o elemento
                    $(seletor).animate
                    (
                        propriedades,
                        {
                            ...opcoes,
                            complete: () => resolver()
                        }
                    );
                }
            );
        };
        
        async function iniciarAnimacoes ()
        {
            await animarElemento('div', { width: '+=300' }, { duration: 100 });
            await animarElemento('div', { width: '-=300' }, { duration: 'slow' });
            await animarElemento('div', { top: '+=300', left: '+=300' }, { duration: 600 });
            await animarElemento('div', { deg: '3300' }, { duration: 3000, step: function (agora) { $(this).css('transform', `rotate(${agora}deg)`) } });
        };

        iniciarAnimacoes();
    </script>
</body>
