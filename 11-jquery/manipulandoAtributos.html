<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <title>Manipulando Atributos</title>
    <link rel='stylesheet' href='css/estilo.css'>
    <script src='js/jquery.js'></script>
    <style>
        [wm-relogio] {
            text-align: center;
        }

        [wm-relogio] button {
            font-size: 1.6em;
            padding: 0px 25px;
            margin: 10px;
        }
    </style>
</head>

<body class='conteudo exercicio'>
    <h1>Manipulando Atributos</h1>
    <div wm-relogio='1000'></div>
    <div wm-relogio='3000'></div>
    <script>
        function Relogio (elemento)
        {
            const $paragrafoHora = $('<p>').html('0');
            const $botaoMenos = $('<button>').html('-');
            const $botaoMais = $('<button>').html('+');

            const $elemento = $(elemento);
            $elemento.append($paragrafoHora, $botaoMenos, $botaoMais);
            
            let temporizador = null;
            
            // Captura o valor do atributo 'wm-relogio' do elemento passado como parâmetro
            const getIntervaloAtual = () => parseInt($elemento.attr('wm-relogio'));

            function iniciar ()
            {
                if (temporizador) clearInterval(temporizador);
                temporizador = setInterval
                (
                    () =>
                    {
                        $paragrafoHora.html(new Date().toLocaleString('pt-BR'));
                    },
                    getIntervaloAtual()
                );
            };

            function alterarIntervalo (delta)
            {
                const novoIntervalo = Math.max(getIntervaloAtual() + delta, 1000);

                // Altera o valor do atributo 'wm-relogio'
                $elemento.attr('wm-relogio', novoIntervalo);

                iniciar();
            };
            
            // Configura as funções a serem executadas ao clicar nos botões
            $botaoMenos.click(evento => alterarIntervalo(1000));
            $botaoMais.click(evento => alterarIntervalo(-1000));

            iniciar();
        };
        
        // Cria um novo relógio para cada elemento com o atributo 'wm-relogio'
        $('[wm-relogio]').each((indice, elemento) => new Relogio(elemento));

        // Adiciona novos atributos aos elementos com o atributo 'wm-relogio'
        $('[wm-relogio]').attr({ saudacao: 'A paz de Deus!', novo: true });

        // Remove atributos dos elementos com o atributo 'wm-relogio'
        $('[wm-relogio]').removeAttr('saudacao').removeAttr('novo');
    </script>
</body>
