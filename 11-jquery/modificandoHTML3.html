<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <title>Modificando HTML #03</title>
    <link rel='stylesheet' href='css/estilo.css'>
    <script src='js/jquery.js'></script>
</head>

<body class='conteudo exercicio'>
    <h1>Modificando HTML #03</h1>
    <div id='conteudo'></div>

    <script>
        // Aguarda o carregamento completo da página antes de manipulá-la
        //$(document).ready
        $
        (
            function ()
            {
                const alunos =
                [
                    { nome: 'Ana', nota: 9.1 },
                    { nome: 'Bianca', nota: 8.4 },
                    { nome: 'Carlos', nota: 7.6 },
                    { nome: 'Julia', nota: 9.7 }
                ];
                
                const linhas = alunos.map
                (
                    aluno =>
                    {
                        const dadoNome = $('<td>').html(aluno.nome);
                        const dadoNota = $('<td>').html(aluno.nota);
                        const linha = $('<tr>').append(dadoNome, dadoNota);
                        
                        return linha;
                    }
                );
                const tabela = $('<table>').append(linhas).css('border', 'solid 5px');
                
                $('#conteudo').append(tabela);
            }
        );
    </script>
</body>
