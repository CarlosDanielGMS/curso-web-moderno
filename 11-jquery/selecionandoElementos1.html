<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <title>Selecionando Elementos #01</title>
    <link rel='stylesheet' href='css/estilo.css'>
    <script src='js/jquery.js'></script>
    <style>
        .negrito {
            font-weight: bold;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        form input,
        form select,
        form button {
            margin: 10px;
            font-size: 1.6em;
        }
    </style>
</head>

<body class='conteudo exercicio'>
    <h1>Selecionando Elementos #01</h1>
    <div>
        <p>Parágrafo
            <span class='negrito'>dentro span</span>
        </p>
    </div>
    <div>
        <ul id='feira'>
            <li>Arroz</li>
            <li wm-obrigatorio>Feijão</li>
            <li class='opcional'>Carne</li>
            <li class='opcional'>Ovo</li>
        </ul>
    </div>
    <form>
        <input type='text' name='texto'>
        <input type='password' name='senha'>
        <input type='checkbox' name='check1'>
        <input type='radio' name='radio1'>
        <input type='file' name='arquivo'>
    </form>

    <script>
        // Seletores CSS padrões
        $('#feira').addClass('destaque').removeClass('destaque'); // Adiciona e remove a classe 'destaque' dos elementos com o atributo 'ID' com o valor 'feira'
        $('li').addClass('destaque'); // Adiciona a classe 'destaque' aos elementos do tipo 'li'
        $('[wm-obrigatorio]').removeClass('destaque'); // Remove a classe 'destaque' dos elementos com o atributo 'wm-obrigatorio'
        $('li.opcional').removeClass('destaque'); // Remove a classe 'destaque' dos elementos do tipo 'li' com a classe 'opcional'
        $('div p span').addClass('destaque'); // Adiciona a classe 'destaque' aos elementos do tipo 'span' que estiverem dentro de um elemento do tipo 'p', que por sua vez esteja dentro de um elemento do tipo 'div'

        // Seletores exclusivos do jQuery
        $('li:first').css('border', 'solid 3px yellow'); // Adiciona o estilo CSS ao primeiro elemento do tipo 'li'
        $('li:odd').css('border', 'solid 10px orange'); // Adiciona o estilo CSS a todos os elementos ímpares do tipo 'li'
        $('li:gt(1)').css('border', 'solid 10px white'); // Adiciona o estilo CSS a todos os elementos do tipo 'li' depois do índice '1'
        $('li:not(:last)').css('border', 'none'); // Adiciona o estilo CSS a todos os elementos do tipo 'li', exceto o último
        $('li:contains("r")').css('background-color', 'black'); // Adiciona o estilo CSS a todos os elementos do tipo 'li' que contém a letra 'r'
        
        $('form *').hide(); // Oculta todos os elementos que estiverem dentro de um elemento do tipo 'form'
        $('form :text').show(); // Oculta todos os elementos que estiverem dentro de um elemento do tipo 'form' com o atributo 'type' com o valor 'text'
        $('form :password').show(); // Oculta todos os elementos que estiverem dentro de um elemento do tipo 'form' com o atributo 'type' com o valor 'password'
        $('form :checkbox').show(); // Oculta todos os elementos que estiverem dentro de um elemento do tipo 'form' com o atributo 'type' com o valor 'checkbox'
        $('form :radio').show(); // Oculta todos os elementos que estiverem dentro de um elemento do tipo 'form' com o atributo 'type' com o valor 'radio'
        $('form :file').show(); // Oculta todos os elementos que estiverem dentro de um elemento do tipo 'form' com o atributo 'type' com o valor 'file'
    </script>
</body>
