<div class="exercicio">
    <h1>1. Grid Básica</h1>
    <hr>

    <!-- Grid Básica -->
    
    <!-- Ocupa a tela inteira -->
    <div class="container-fluid">
        <div class="row">
            <!-- Ocupa o espaço igualmente -->
            <div class="col bg-primary">1</div>
            <!-- Ocupa o espaço igualmente -->
            <div class="col bg-danger">2</div>
            <!-- Ocupa o espaço igualmente -->
            <div class="col bg-warning">3</div>
            <!-- Ocupa o espaço igualmente -->
            <div class="col bg-info">4</div>
            <!-- Ocupa o espaço igualmente -->
            <div class="col bg-secondary">5</div>
        </div>
        <div class="row mt-3">
            <!-- Ocupa o espaço igualmente -->
            <div class="col bg-danger">1</div>
            <!-- Ocupa o espaço equivalente a 4 das 12 colunas -->
            <div class="col-4 bg-warning">2</div>
            <!-- Ocupa o espaço equivalente a 5 das 12 colunas -->
            <div class="col-5 bg-info">3</div>
            <!-- Ocupa o espaço igualmente -->
            <div class="col bg-primary">4</div>
        </div>
    </div>

    <h1 class="mt-5">2. Grid Responsiva</h1>
    <hr>

    <!-- Grid Responsiva -->
    
    <div class="container-fluid">
        <div class="row">
            <!-- Tela extra grande: cada elemento ocupa 1 das 12 colunas -->
            <!-- Tela grande: cada elemento ocupa 2 das 12 colunas -->
            <!-- Tela média: cada elemento ocupa 4 das 12 colunas -->
            <!-- Tela pequena: cada elemento ocupa 6 das 12 colunas -->
            <!-- Tela extra pequena: cada elemento ocupa 12 das 12 colunas -->
            <div class="col-12 col-sm-6 col-md-4 col-lg-2 col-xl-1 bg-primary">01</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2 col-xl-1 bg-danger">02</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2 col-xl-1 bg-warning">03</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2 col-xl-1 bg-info">04</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2 col-xl-1 bg-success">05</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2 col-xl-1 bg-secondary">06</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2 col-xl-1 bg-danger">07</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2 col-xl-1 bg-info">08</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2 col-xl-1 bg-success">09</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2 col-xl-1 bg-secondary">10</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2 col-xl-1 bg-warning">11</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2 col-xl-1 bg-primary">12</div>
        </div>
    </div>

    <h1 class="mt-5">3. Quebra de Linha</h1>
    <hr>

    <!-- Quebra de Linha -->
    
    <div class="container-fluid">
        <div class="row">
            <div class="col-3 bg-primary">1</div>
            <div class="col-3 bg-danger">2</div>
            <div class="col-7 bg-success">3</div>
            <!-- Quebra a linha -->
            <div class="w-100"></div>
            <div class="col-3 bg-warning">4</div>
        </div>
    </div>

    <h1 class="mt-5">4. Ordem</h1>
    <hr>

    <!-- Ordem -->
